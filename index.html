const fmtD=d=>{try{return new Date(d+"T12:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});}catch{return d;}};
const lsGet=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

const SB_URL="https://qeqhrbleatfbkmxbmtnk.supabase.co";
const SB_KEY="sb_publishable_eY2ZZrVG7_r9pNxMtoR7ew_uYP7uoQ7";
const SB_HDR={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

async function stGet(key){
  try{
    const r=await fetch(SB_URL+"/rest/v1/pedidos?id=eq."+key+"&select=data",{headers:SB_HDR});
    if(r.ok){const rows=await r.json();if(rows&&rows.length>0)return JSON.parse(rows[0].data);}
  }catch(e){console.warn("stGet:",e);}
  return lsGet(key,null);
}
async function stSet(key,val){
  try{
    const s=JSON.stringify(val);
    lsSet(key,s);
    const patch=await fetch(SB_URL+"/rest/v1/pedidos?id=eq."+key,{method:"PATCH",headers:{...SB_HDR,"Prefer":"return=minimal"},body:JSON.stringify({data:s,updated_at:new Date().toISOString()})});
    if(patch.status===404||patch.status===0){
      await fetch(SB_URL+"/rest/v1/pedidos",{method:"POST",headers:{...SB_HDR,"Prefer":"return=minimal"},body:JSON.stringify({id:key,data:s})});
    }
  }catch(e){console.warn("stSet:",e);}
}

function effPrice(pid,prices,prods,mult){
  if(prices&&prices[pid]!=null)return Number(prices[pid]);
  const p=prods.find(x=>x.id===pid);
  return p?p.listPrice*mult:0;
}
function orderTotal(order,prods,mult){
  return Object.entries(order.grid||{}).reduce((s,[key,qty])=>{
    const pid=Number(key.split("|")[0]);
    return s+effPrice(pid,order.prices||{},prods,mult)*qty;
  },0);
}
function orderUnits(order){return Object.values(order.grid||{}).reduce((s,v)=>s+v,0);}

            </div>
            {canEditCat(user.role)&&(
              <button onClick={()=>setShowCost(v=>!v)} style={{padding:"5px 11px",borderRadius:20,border:"none",cursor:"pointer",background:showCost?"#2d7a4f":"#ece9e4",color:showCost?"#fff":"#555",fontSize:11,fontWeight:700,flexShrink:0}}>
                💰 {showCost?"Viendo costo":"Ver costo"}

                showCost={showCost&&canEditCat(user.role)}
                onPriceChange={v=>setPrice(p.id,v)}
                onPriceReset={()=>setO(prev=>{const pr={...prev.prices};delete pr[p.id];return{...prev,prices:pr};})}
                getQty={getQty} setQty={setQty}
                onAddVariant={()=>setVarModal(p.id)}
                even={pi%2===0}/>
            ))}
          </div>
        </div>

        <div style={{position:"sticky",top:70}} className="sp">
          <div style={{background:"#1a1a1a",color:"#f7f4f0",borderRadius:12,padding:"14px 16px",marginBottom:10}}>
            <div style={{fontSize:10,color:"#a0998f",fontWeight:700,letterSpacing:1.2,marginBottom:2}}>TOTAL DEL PEDIDO</div>
            <div style={{fontSize:32,fontWeight:700,lineHeight:1.1}}>{fmt(total)}</div>
            <div style={{fontSize:12,color:"#a0998f",marginTop:2}}>{units} prenda{units!==1?"s":""}</div>
          </div>

          {summary.length===0?(
            <div style={{background:"#fff",borderRadius:12,padding:"20px 16px",textAlign:"center",color:"#bbb",fontSize:13,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>← Ingresá cantidades</div>
          ):(
            <div style={{background:"#fff",borderRadius:12,padding:"12px 14px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",maxHeight:360,overflowY:"auto"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#aaa",letterSpacing:1.2,marginBottom:10}}>RESUMEN POR ARTÍCULO</div>
              {summary.map((item,i)=>(
                <div key={i} style={{marginBottom:12,paddingBottom:i<summary.length-1?12:0,borderBottom:i<summary.length-1?"1px solid #f5f2ee":"none"}}>

                    <span style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{fmt(item.total)}</span>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {item.rows.map((r,j)=>(
                      <span key={j} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,background:"#f5f2ee",padding:"3px 8px",borderRadius:8,color:"#444"}}>
                        {r.c&&<span style={{width:8,height:8,borderRadius:"50%",background:COLOR_HEX[r.c]||"#ccc",border:"1px solid rgba(0,0,0,.15)",display:"inline-block",flexShrink:0}}/>}
                        {r.c&&<span>{r.c}</span>}
                        <span style={{fontWeight:700}}>{r.s}</span>
                        <span style={{color:"#999"}}>×{r.q}</span>
                      </span>
                    ))}

                </div>
              ))}
            </div>
          )}

          <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
            <button onClick={()=>{try{onSave({...o,extraColors,extraSizes});}catch(e){alert("Error al guardar. Intentá de nuevo.");}}} style={{padding:13,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer"}}>💾 Guardar pedido</button>
            <button onClick={onCancel} style={{padding:11,background:"#f0ede8",color:"#333",border:"none",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── PROD ROW ──────────────────────────────────────────────────────
function ProdRow({p,colors,sizes,salePrice,customPrice,showCost,onPriceChange,onPriceReset,getQty,setQty,onAddVariant,even}){
  const [open,setOpen]=useState(false);
  const [editP,setEditP]=useState(false);
  const [tmpP,setTmpP]=useState("");
  const allColors=colors.length>0?colors:[""];
  const totalUnits=useMemo(()=>allColors.reduce((s,c)=>s+sizes.reduce((ss,sz)=>ss+getQty(p.id,c,sz),0),0),[allColors,sizes,getQty,p.id]);
  const margin=p.costPrice>0?((salePrice-p.costPrice)/p.costPrice*100).toFixed(0):null;
  return(
    <div style={{borderBottom:"1px solid #f0ede8"}}>
      <div onClick={()=>setOpen(v=>!v)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",cursor:"pointer",background:even?"#fff":"#faf9f7",userSelect:"none"}}>
        <div style={{flex:1,minWidth:0,paddingRight:8}}>
          <span style={{fontWeight:600,fontSize:14}}>{p.name}</span>
          {p.preorder&&<span style={{fontSize:10,background:"#e8f0ff",color:"#3355aa",padding:"1px 6px",borderRadius:8,marginLeft:6,fontWeight:700}}>📦</span>}
          {customPrice&&<span style={{fontSize:10,background:"#f5e8d0",color:"#8a5a1a",padding:"1px 6px",borderRadius:8,marginLeft:4,fontWeight:600}}>editado</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
          {totalUnits>0&&<span style={{background:"#1a1a1a",color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:700}}>{totalUnits} ud.</span>}
          <span style={{color:"#ccc",fontSize:11}}>{open?"▲":"▼"}</span>
        </div>
      </div>
      {open&&(
        <div style={{padding:"4px 14px 14px",background:even?"#fff":"#faf9f7",overflowX:"auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,padding:"8px 10px",background:"#f5f2ee",borderRadius:8,flexWrap:"wrap"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:"#888",fontWeight:700,letterSpacing:.5}}>PRECIO VENTA</div>
              {editP?(
                <div style={{display:"flex",gap:6,alignItems:"center",marginTop:3}}>
                  <input type="number" value={tmpP} onChange={e=>setTmpP(e.target.value)} autoFocus
                    onKeyDown={e=>e.key==="Enter"&&(onPriceChange(tmpP),setEditP(false))}
                    style={{width:100,padding:"5px 8px",border:"2px solid #1a1a1a",borderRadius:6,fontSize:14,fontWeight:700}}/>
                  <button onClick={()=>{onPriceChange(tmpP);setEditP(false);}} style={{padding:"5px 10px",background:"#1a1a1a",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700}}>✓</button>
                  <button onClick={()=>setEditP(false)} style={{padding:"5px 8px",background:"#ece9e4",border:"none",borderRadius:6,cursor:"pointer",fontSize:12}}>✗</button>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3,flexWrap:"wrap"}}>
                  <span style={{fontSize:18,fontWeight:700}}>{fmt(salePrice)}</span>
                  <button onClick={e=>{e.stopPropagation();setTmpP(String(salePrice));setEditP(true);}} style={{fontSize:11,color:"#c19a6b",background:"none",border:"1px solid #c19a6b",padding:"3px 8px",borderRadius:6,cursor:"pointer",fontWeight:600}}>✏️ Editar</button>
                  {customPrice&&<button onClick={e=>{e.stopPropagation();onPriceReset();}} style={{fontSize:11,color:"#888",background:"none",border:"1px solid #ddd",padding:"3px 8px",borderRadius:6,cursor:"pointer"}}>↩ Reset</button>}
                </div>
              )}
            </div>
            {showCost&&p.costPrice>0&&(
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:10,color:"#888",fontWeight:700}}>COSTO</div>
                <div style={{fontSize:14,fontWeight:700,color:"#555"}}>{fmt(p.costPrice)}</div>
                {margin&&<div style={{fontSize:11,color:"#2d7a4f",fontWeight:700}}>+{margin}%</div>}
              </div>
            )}
          </div>
          <table style={{borderCollapse:"collapse",width:"100%",minWidth:260}}>
            <thead>
              <tr>
                {colors.length>0&&<th style={{textAlign:"left",padding:"4px 8px 4px 0",color:"#999",fontSize:11,fontWeight:700}}>COLOR</th>}
                {sizes.map(s=><th key={s} style={{padding:"4px 4px",color:"#555",fontSize:12,fontWeight:700,textAlign:"center",minWidth:46}}>{s}</th>)}
                <th style={{padding:"4px 0 4px 6px",color:"#aaa",fontSize:10,fontWeight:600,textAlign:"right",minWidth:58}}>SUBTOT.</th>
              </tr>
            </thead>
            <tbody>
              {allColors.map(c=>{
                const rowU=sizes.reduce((s,sz)=>s+getQty(p.id,c,sz),0);
                return(
                  <tr key={c||"_"} style={{borderTop:"1px solid #f0ede8"}}>
                    {colors.length>0&&(
                      <td style={{padding:"4px 8px 4px 0",verticalAlign:"middle"}}>
                        <div style={{display:"flex",alignItems:"center",gap:5}}>
                          <span style={{width:10,height:10,borderRadius:"50%",background:COLOR_HEX[c]||"#ccc",border:"1px solid rgba(0,0,0,.15)",flexShrink:0,display:"inline-block"}}/>
                          <span style={{fontSize:12,color:"#444",whiteSpace:"nowrap"}}>{c}</span>
                        </div>
                      </td>
                    )}
                    {sizes.map(s=>(
                      <td key={s} style={{padding:"3px 2px",textAlign:"center",verticalAlign:"middle"}}>
                        <QCell qty={getQty(p.id,c,s)} onChange={v=>setQty(p.id,c,s,v)}/>
                      </td>
                    ))}
                    <td style={{padding:"3px 0 3px 6px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                      <span style={{fontSize:12,fontWeight:rowU>0?700:400,color:rowU>0?"#1a1a1a":"#ccc"}}>{rowU>0?fmt(salePrice*rowU):"—"}</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <button onClick={e=>{e.stopPropagation();onAddVariant();}} style={{marginTop:10,fontSize:12,color:"#3355aa",background:"none",border:"1px dashed #3355aa",padding:"5px 12px",borderRadius:8,cursor:"pointer",fontWeight:600,width:"100%"}}>
            + Agregar color o talle
          </button>
        </div>
      )}
    </div>
  );
}

// ── VARIANT MODAL ─────────────────────────────────────────────────
function VariantModal({pid,prodName,onAdd,onClose}){
  const [color,setColor]=useState("");
  const [size,setSize]=useState("");
  return(
    <div className="ov" onClick={onClose}>
      <div className="md" onClick={e=>e.stopPropagation()}>
        <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,marginBottom:4}}>Agregar variante</h3>
        <p style={{fontSize:13,color:"#888",marginBottom:18}}>{prodName}</p>
        <Fld label="Nuevo color (opcional)" val={color} set={setColor} ph="Ej: Tiza, Nude, Verde agua"/>
        <Fld label="Nuevo talle (opcional)"  val={size}  set={setSize}  ph="Ej: XXL, 48, Oversize"/>
        <p style={{fontSize:11,color:"#bbb",marginBottom:14}}>Podés agregar color, talle, o ambos a la vez.</p>
        <div style={{display:"flex",gap:8}}>
          <Btn primary onClick={()=>{if(!color&&!size)return;onAdd(pid,color.trim()||null,size.trim()||null);}}>Agregar</Btn>
          <Btn onClick={onClose}>Cancelar</Btn>
        </div>
      </div>
    </div>
  );
}

// ── QTY CELL ──────────────────────────────────────────────────────
function QCell({qty,onChange}){
  const [editing,setEditing]=useState(false);
  const [tmp,setTmp]=useState("");
  if(editing)return(
    <input type="number" min="0" value={tmp} onChange={e=>setTmp(e.target.value)} autoFocus
      onBlur={()=>{onChange(Math.max(0,parseInt(tmp)||0));setEditing(false);}}
      onKeyDown={e=>{if(e.key==="Enter"||e.key==="Tab"){onChange(Math.max(0,parseInt(tmp)||0));setEditing(false);}}}
      style={{width:40,height:30,textAlign:"center",border:"2px solid #1a1a1a",borderRadius:6,fontSize:14,fontWeight:700,padding:0}}/>
  );
  const a=qty>0;
  return(
    <div style={{display:"inline-flex",alignItems:"center",border:`1px solid ${a?"#b8a99a":"#e0dcd6"}`,borderRadius:8,overflow:"hidden",background:a?"#f5ede0":"#fff"}}>
      <button onClick={()=>onChange(Math.max(0,qty-1))} style={{width:22,height:30,border:"none",background:"transparent",cursor:"pointer",fontSize:14,color:a?"#5c3317":"#bbb",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
      <span onClick={()=>{setTmp(String(qty));setEditing(true);}} style={{minWidth:22,height:30,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:a?700:400,fontSize:12,color:a?"#1a1a1a":"#ccc",cursor:"text",userSelect:"none"}}>{a?qty:"·"}</span>
      <button onClick={()=>onChange(qty+1)} style={{width:22,height:30,border:"none",background:a?"#5c3317":"transparent",cursor:"pointer",fontSize:14,color:a?"#fff":"#bbb",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
    </div>
  );
}

// ── AGENDA ────────────────────────────────────────────────────────
function Agenda({user,appts,saveAppts}){
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:"",time:"",clientName:"",address:"",notes:""});
  const [editId,setEditId]=useState(null);
  const today=new Date().toISOString().split("T")[0];
  const mine=useMemo(()=>canSeeAll(user.role)?appts:appts.filter(a=>a.userId===user.id),[appts,user]);
  const upcoming=useMemo(()=>[...mine].filter(a=>a.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),[mine,today]);
  const past=useMemo(()=>[...mine].filter(a=>a.date<today).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),[mine,today]);
  const save=()=>{
    if(!form.date||!form.clientName)return;
    if(editId)saveAppts(p=>p.map(a=>a.id===editId?{...form,id:editId,userId:user.id,userName:user.name}:a));
    else saveAppts(p=>[...p,{...form,id:Date.now(),userId:user.id,userName:user.name}]);
    setForm({date:"",time:"",clientName:"",address:"",notes:""});setShowForm(false);setEditId(null);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700}}>Agenda</h2>
        <Btn primary onClick={()=>{setShowForm(v=>!v);setEditId(null);setForm({date:"",time:"",clientName:"",address:"",notes:""});}}>+ Nueva cita</Btn>
      </div>
      {showForm&&(
        <div style={{background:"#fff",borderRadius:12,padding:16,marginBottom:20,border:"2px solid #1a1a1a",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>{editId?"Editar":"Nueva"} cita</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Fld label="Fecha" type="date" val={form.date} set={v=>setForm(p=>({...p,date:v}))}/>
            <Fld label="Hora"  type="time" val={form.time} set={v=>setForm(p=>({...p,time:v}))}/>
          </div>
          <Fld label="Cliente"   val={form.clientName} set={v=>setForm(p=>({...p,clientName:v}))} ph="Nombre"/>
          <Fld label="Dirección" val={form.address}    set={v=>setForm(p=>({...p,address:v}))}    ph="Calle, número, ciudad"/>
          <Fld label="Notas"     val={form.notes}      set={v=>setForm(p=>({...p,notes:v}))}      ph="Observaciones…"/>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <Btn primary onClick={save}>{editId?"Guardar":"Agregar"} cita</Btn>
            <Btn onClick={()=>{setShowForm(false);setEditId(null);}}>Cancelar</Btn>
          </div>
        </div>
      )}
      {upcoming.length===0&&past.length===0&&<Empty icon="📅" text="No hay citas agendadas"/>}
      {upcoming.length>0&&<><SLbl>Próximas</SLbl>{upcoming.map(a=>(
        <div key={a.id} style={{background:"#fff",borderRadius:12,padding:"12px 16px",marginBottom:10,borderLeft:"4px solid #c19a6b",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontWeight:700,fontSize:14,marginBottom:3}}>{a.clientName}</div>
              <div style={{fontSize:12,color:"#666",display:"flex",flexWrap:"wrap",gap:"3px 12px"}}>
                <span>📅 {fmtD(a.date)}{a.time?` — ${a.time}hs`:""}</span>
                {a.address&&<span>📍 {a.address}</span>}
                {a.notes&&<span>📝 {a.notes}</span>}
              </div>
            </div>
            <div style={{display:"flex",gap:4}}>
              <IBtn onClick={()=>{setForm({date:a.date,time:a.time||"",clientName:a.clientName,address:a.address||"",notes:a.notes||""});setEditId(a.id);setShowForm(true);}}>✏️</IBtn>
              <IBtn onClick={()=>saveAppts(p=>p.filter(x=>x.id!==a.id))}>🗑</IBtn>
            </div>
          </div>
        </div>
      ))}</>}
      {past.length>0&&<><SLbl style={{marginTop:20}}>Historial</SLbl>{past.slice(0,5).map(a=>(
        <div key={a.id} style={{background:"#fff",borderRadius:12,padding:"12px 16px",marginBottom:8,borderLeft:"4px solid #e0d8cc",opacity:.65,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:600,fontSize:14}}>{a.clientName}</div>
          <div style={{fontSize:12,color:"#666"}}>{fmtD(a.date)}{a.address?` · ${a.address}`:""}</div>
        </div>
      ))}</>}
    </div>
  );
}

// ── CATÁLOGO ──────────────────────────────────────────────────────
function Catalog({user,prods,saveProds,mult,setMult}){
  const INIT_IDS=useMemo(()=>new Set(PRODUCTS.map(p=>p.id)),[]);
  const [editId,setEditId]=useState(null);

  const [search,setSearch]=useState("");
  const [catF,setCatF]=useState("Todos");
  const [showPre,setShowPre]=useState(false);
  const [editMult,setEditMult]=useState(false);
  const [tmpMult,setTmpMult]=useState(mult);
  const [showAdd,setShowAdd]=useState(false);
  const [newP,setNewP]=useState({name:"",category:"Preventa",colors:"",sizes:"",listPrice:"",costPrice:""});
  const cats=useMemo(()=>["Todos",...Array.from(new Set(prods.map(p=>p.category)))]  ,[prods]);
  const visible=useMemo(()=>prods.filter(p=>{
    if(showPre)return p.preorder&&(!search||p.name.toLowerCase().includes(search.toLowerCase()));
    return(catF==="Todos"||p.category===catF)&&(!search||p.name.toLowerCase().includes(search.toLowerCase()));
  }),[prods,showPre,catF,search]);
  const addProd=()=>{
    if(!newP.name)return;
    saveProds(prev=>[...prev,{id:Date.now(),name:newP.name.trim(),category:newP.category||"Preventa",colors:newP.colors?newP.colors.split(",").map(c=>c.trim()).filter(Boolean):[],sizes:newP.sizes?newP.sizes.split(",").map(s=>s.trim()).filter(Boolean):[],listPrice:Number(newP.listPrice)||0,costPrice:Number(newP.costPrice)||0}]);
    setNewP({name:"",category:"Preventa",colors:"",sizes:"",listPrice:"",costPrice:""});setShowAdd(false);
  };
  return(
    <div>
      <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,marginBottom:16}}>Catálogo</h2>
      {canEditCat(user.role)&&(
        <div style={{background:"#1a1a1a",color:"#f7f4f0",borderRadius:12,padding:"14px 16px",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:10,color:"#a0998f",fontWeight:700,letterSpacing:1.2}}>MULTIPLICADOR</div>
              <div style={{fontSize:30,fontWeight:700,lineHeight:1.2}}>{mult}×</div>
              <div style={{fontSize:12,color:"#a0998f"}}>Lista × {mult} = precio venta</div>
            </div>
            {!editMult?(
              <Btn onClick={()=>{setTmpMult(mult);setEditMult(true);}} style={{background:"#c19a6b",color:"#fff",border:"none"}}>✏️ Cambiar</Btn>
            ):(
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="number" step="0.1" value={tmpMult} onChange={e=>setTmpMult(e.target.value)}
                  style={{width:68,padding:"7px",border:"1px solid #555",background:"#2a2a2a",color:"#fff",borderRadius:8,fontSize:18,textAlign:"center"}}/>
                <Btn onClick={()=>{setMult(Number(tmpMult));setEditMult(false);}} style={{background:"#c19a6b",color:"#fff",border:"none"}}>✓</Btn>
              </div>
            )}
          </div>
          <div style={{marginTop:10,padding:"7px 12px",background:"#2a2a2a",borderRadius:8,fontSize:12,color:"#c8c0b4"}}>
            $10.000 × {mult} = <strong style={{color:"#c19a6b"}}>{fmt(10000*mult)}</strong>
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:10,marginBottom:10,alignItems:"center"}}>
        <input placeholder="🔍 Buscar…" value={search} onChange={e=>setSearch(e.target.value)}
          style={{flex:1,padding:"10px 14px",border:"1px solid #ddd",borderRadius:8,fontSize:14}}/>
        {canEditCat(user.role)&&<Btn primary onClick={()=>setShowAdd(v=>!v)}>+ Agregar</Btn>}
      </div>
      {showAdd&&canEditCat(user.role)&&(
        <div style={{background:"#fff",borderRadius:12,padding:16,marginBottom:16,border:"2px solid #1a1a1a",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>Nuevo artículo</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Fld label="Nombre" val={newP.name} set={v=>setNewP(p=>({...p,name:v}))} ph="Ej: Sweater Nuevo"/>
            <Fld label="Categoría" val={newP.category} set={v=>setNewP(p=>({...p,category:v}))} ph="Preventa"/>
          </div>
          <Fld label="Colores (separar con coma)" val={newP.colors} set={v=>setNewP(p=>({...p,colors:v}))} ph="Negro, Beige, Camel"/>
          <Fld label="Talles (separar con coma)"  val={newP.sizes}  set={v=>setNewP(p=>({...p,sizes:v}))}  ph="S, M, L"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Fld label="Precio lista" type="number" val={newP.listPrice}  set={v=>setNewP(p=>({...p,listPrice:v}))}  ph="0"/>
            <Fld label="Precio costo" type="number" val={newP.costPrice}  set={v=>setNewP(p=>({...p,costPrice:v}))}  ph="0"/>
          </div>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <Btn primary onClick={addProd}>Agregar</Btn>
            <Btn onClick={()=>setShowAdd(false)}>Cancelar</Btn>
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:14}}>
        {cats.map(c=>(
          <button key={c} onClick={()=>{setCatF(c);setShowPre(false);}} style={{padding:"5px 11px",borderRadius:20,border:(catF===c&&!showPre)?"none":"1px solid #ddd",background:(catF===c&&!showPre)?"#1a1a1a":"#fff",color:(catF===c&&!showPre)?"#fff":"#555",fontSize:11,cursor:"pointer",fontWeight:600}}>{c}</button>
        ))}
        <button onClick={()=>{setShowPre(v=>!v);setCatF("Todos");}} style={{padding:"5px 11px",borderRadius:20,border:showPre?"none":"1px solid #3355aa",background:showPre?"#3355aa":"#fff",color:showPre?"#fff":"#3355aa",fontSize:11,cursor:"pointer",fontWeight:700}}>📦 Por ingresar ({prods.filter(p=>p.preorder).length})</button>
      </div>
      {visible.map(p=>{
        const isEd=editId===p.id;const isCustom=!INIT_IDS.has(p.id);const canEdit=canEditCat(user.role);
        const sell=p.listPrice*mult;const margin=p.costPrice>0?((sell-p.costPrice)/p.costPrice*100).toFixed(0):null;
        return(
          <div key={p.id} style={{background:"#fff",borderRadius:12,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,fontSize:15}}>{p.name}</span>
                  {p.preorder&&!isCustom&&<span style={{fontSize:10,background:"#e8f0ff",color:"#3355aa",padding:"2px 7px",borderRadius:8,fontWeight:700}}>📦 POR INGRESAR</span>}
                  {isCustom&&<span style={{fontSize:10,background:"#d4edda",color:"#1a6b3a",padding:"2px 7px",borderRadius:8,fontWeight:700}}>✨ PREVENTA</span>}
                </div>
                <div style={{fontSize:11,color:"#888",marginBottom:6}}>{p.category}</div>
                {p.colors.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>{p.colors.map(c=>(
                  <span key={c} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,color:"#555",background:"#f5f2ee",padding:"2px 7px",borderRadius:10}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:COLOR_HEX[c]||"#ccc",border:"1px solid rgba(0,0,0,.1)",display:"inline-block"}}/>{c}
                  </span>
                ))}</div>}
                {p.sizes.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{p.sizes.map(s=><span key={s} style={{fontSize:11,background:"#f0ede8",padding:"2px 7px",borderRadius:6,fontWeight:600}}>{s}</span>)}</div>}
              </div>
              <div style={{textAlign:"right",minWidth:148}}>
                {isEd&&canEdit?(
                  <div>
                    <Fld label="Lista"  type="number" val={editP.list} set={v=>setEditP(p=>({...p,list:v}))}/>
                    <Fld label="Costo"  type="number" val={editP.cost} set={v=>setEditP(p=>({...p,cost:v}))}/>
                    <div style={{display:"flex",gap:6,marginTop:4,justifyContent:"flex-end"}}>
                      <Btn primary small onClick={()=>{saveProds(prev=>prev.map(x=>x.id===p.id?{...x,listPrice:Number(editP.list),costPrice:Number(editP.cost)}:x));setEditId(null);}}>✓ OK</Btn>
                      <Btn small onClick={()=>setEditId(null)}>✗</Btn>
                    </div>
                  </div>
                ):(
                  <div>
                    <div style={{fontSize:12,color:"#888"}}>Lista: {fmt(p.listPrice)}</div>
                    {canEdit&&p.costPrice>0&&<div style={{fontSize:12,color:"#888"}}>Costo: {fmt(p.costPrice)}</div>}
                    <div style={{fontSize:20,fontWeight:700}}>{fmt(sell)}</div>
                    {canEdit&&margin&&<div style={{fontSize:11,color:"#2d7a4f",fontWeight:700}}>+{margin}% margen</div>}
                    {canEdit&&<div style={{display:"flex",gap:5,marginTop:6,justifyContent:"flex-end",flexWrap:"wrap"}}>
                      <button onClick={()=>{setEditId(p.id);setEditP({list:p.listPrice,cost:p.costPrice});}} style={{fontSize:12,color:"#c19a6b",background:"none",border:"1px solid #c19a6b",padding:"3px 9px",borderRadius:6,cursor:"pointer",fontWeight:600}}>✏️</button>
                      {isCustom&&<button onClick={()=>saveProds(prev=>prev.filter(x=>x.id!==p.id))} style={{fontSize:12,color:"#cc4444",background:"none",border:"1px solid #cc4444",padding:"3px 9px",borderRadius:6,cursor:"pointer",fontWeight:600}}>🗑</button>}
                    </div>}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── USER MGMT ─────────────────────────────────────────────────────
function UserMgmt({user,users,saveUsers}){
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({name:"",username:"",password:"",role:"vendedora"});
  const [showAdd,setShowAdd]=useState(false);
  const rl={admin:"Admin",encargada:"Encargada",vendedora_full:"Vendedora (ve todos)",vendedora:"Vendedora"};
  const saveEdit=()=>{
    if(editId)saveUsers(prev=>prev.map(u=>u.id===editId?{...u,...form}:u));
    else saveUsers(prev=>[...prev,{...form,id:String(Date.now())}]);
    setEditId(null);setShowAdd(false);setForm({name:"",username:"",password:"",role:"vendedora"});
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700}}>Usuarios</h2>
        <Btn primary onClick={()=>{setShowAdd(true);setEditId(null);setForm({name:"",username:"",password:"",role:"vendedora"});}}>+ Agregar</Btn>
      </div>
      {(showAdd||editId)&&(
        <div style={{background:"#fff",borderRadius:12,padding:16,marginBottom:16,border:"2px solid #1a1a1a",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>{editId?"Editar":"Nuevo"} usuario</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Fld label="Nombre visible" val={form.name}     set={v=>setForm(p=>({...p,name:v}))}     ph="Ej: MARIA"/>
            <Fld label="Usuario login"  val={form.username} set={v=>setForm(p=>({...p,username:v}))} ph="Ej: maria"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Fld label="Contraseña" val={form.password} set={v=>setForm(p=>({...p,password:v}))} ph="Nueva contraseña"/>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:12,fontWeight:600,color:"#666",display:"block",marginBottom:3}}>Rol</label>
              <select value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}
                style={{width:"100%",padding:"8px 11px",border:"1px solid #ddd",borderRadius:8,fontSize:14}}>
                {Object.entries(rl).map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <Btn primary onClick={saveEdit}>{editId?"Guardar":"Crear"}</Btn>
            <Btn onClick={()=>{setShowAdd(false);setEditId(null);}}>Cancelar</Btn>
          </div>
        </div>
      )}
      {users.map(u=>(
        <div key={u.id} style={{background:"#fff",borderRadius:12,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontWeight:700,fontSize:15}}>{u.name}</span>
                <span style={{fontSize:10,background:ROLE_COLOR[u.role],color:"#fff",padding:"2px 8px",borderRadius:10,fontWeight:700}}>{rl[u.role]}</span>
              </div>
              <div style={{fontSize:12,color:"#888",marginTop:2}}>@{u.username}</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>{setEditId(u.id);setShowAdd(false);setForm({name:u.name,username:u.username,password:u.password,role:u.role});}} style={{fontSize:12,color:"#c19a6b",background:"none",border:"1px solid #c19a6b",padding:"4px 10px",borderRadius:6,cursor:"pointer",fontWeight:600}}>✏️</button>
              {u.id!==user.id&&<button onClick={()=>{if(confirm(`¿Eliminar a ${u.name}?`))saveUsers(prev=>prev.filter(x=>x.id!==u.id));}} style={{fontSize:12,color:"#cc4444",background:"none",border:"1px solid #cc4444",padding:"4px 10px",borderRadius:6,cursor:"pointer",fontWeight:600}}>🗑</button>}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── PRIMITIVOS ────────────────────────────────────────────────────
function Fld({label,val,set,type="text",ph,onEnter}){
  return(
    <div style={{marginBottom:10}}>
      <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:4,letterSpacing:.5}}>{label}</label>
      <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph}
        onKeyDown={e=>e.key==="Enter"&&onEnter&&onEnter()}
        style={{width:"100%",padding:"9px 12px",border:"1px solid #ddd",borderRadius:8,fontSize:14,boxSizing:"border-box"}}/>
    </div>
  );
}
function Btn({children,onClick,primary,small,style={}}){
  return<button onClick={onClick} style={{padding:small?"5px 12px":primary?"11px 18px":"10px 18px",background:primary?"#1a1a1a":"#f0ede8",color:primary?"#fff":"#333",border:"none",borderRadius:8,fontSize:small?12:14,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",...style}}>{children}</button>;
}
const IBtn=({children,onClick})=><button onClick={e=>{e.stopPropagation();onClick();}} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"2px 4px"}}>{children}</button>;
const SCard=({label,val,dark})=>(
  <div style={{background:dark?"#1a1a1a":"#fff",color:dark?"#f7f4f0":"#1a1a1a",borderRadius:12,padding:"12px 16px",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
    <div style={{fontSize:10,fontWeight:700,color:dark?"#a0998f":"#888",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>{label}</div>
    <div style={{fontSize:20,fontWeight:700}}>{val}</div>
  </div>
);
const SBadge=({status})=>{
  const m={borrador:["#f5f0e8","#8a6d3b"],confirmado:["#e8f5ee","#2d7a4f"],entregado:["#e8e8e8","#555"]};
  const l={borrador:"Borrador",confirmado:"Confirmado",entregado:"Entregado"};
  const [bg,col]=m[status]||m.borrador;
  return<span style={{fontSize:10,background:bg,color:col,padding:"2px 7px",borderRadius:8,fontWeight:700}}>{l[status]||status}</span>;
};
const SLbl=({children,style={}})=><div style={{fontSize:10,fontWeight:700,color:"#888",letterSpacing:1.5,textTransform:"uppercase",marginBottom:8,...style}}>{children}</div>;
const Empty=({icon,text})=>(
  <div style={{textAlign:"center",padding:"48px 24px",color:"#bbb"}}>
    <div style={{fontSize:44,marginBottom:10}}>{icon}</div>
    <div style={{fontSize:14}}>{text}</div>
  </div>
);

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){console.error("App error:",e,info);}
  render(){
    if(this.state.err)return(
      <div style={{padding:32,textAlign:"center",fontFamily:"sans-serif"}}>
        <div style={{fontSize:32,marginBottom:16}}>⚠️</div>
        <div style={{fontSize:18,fontWeight:600,marginBottom:8}}>Algo salió mal</div>
        <div style={{fontSize:13,color:"#888",marginBottom:24}}>{String(this.state.err)}</div>
        <button onClick={()=>{this.setState({err:null});}} style={{padding:"10px 20px",background:"#1a1a1a",color:"#fff",border:"none",borderRadius:8,fontSize:14,cursor:"pointer"}}>Reintentar</button>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
